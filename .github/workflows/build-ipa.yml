name: Build IPA — AppSync/Filza (no Apple account)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    env:
      SCHEME:    SUNAPSEZERO
      PROJECT:   SUNAPSEZERO.xcodeproj
      BUNDLE_ID: com.sunapsezero.app

    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project  "$PROJECT"  \
            -scheme   "$SCHEME"   \
            -sdk      iphoneos    \
            -configuration Release \
            ARCHS=armv7 \
            VALID_ARCHS=armv7 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=7.0 \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            2>&1 | tee build.log | tail -50

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/build" -name "*.app" -maxdepth 2 | head -1)
          echo "Found: $APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r SUNAPSEZERO.ipa Payload/
          echo "IPA size: $(du -sh SUNAPSEZERO.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUNAPSEZERO-armv7-unsigned
          path: ${{ runner.temp }}/SUNAPSEZERO.ipa
          retention-days: 90
