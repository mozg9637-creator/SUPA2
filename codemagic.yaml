workflows:
  ios-unsigned:
    name: SUNAPSEZERO unsigned IPA
    max_build_duration: 30
    environment:
            xcode: latest
    scripts:
      - name: Build unsigned .app
        script: |
          xcodebuild build \
            -project SUNAPSEZERO.xcodeproj \
            -scheme SUNAPSEZERO \
            -sdk iphoneos \
            -configuration Release \
            ARCHS=armv7 \
            VALID_ARCHS=armv7 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=7.0 \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build"
      - name: Package IPA
        script: |
          APP=$(find "$CM_BUILD_DIR/build" -name "*.app" | head -1)
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -r SUNAPSEZERO.ipa Payload/
    artifacts:
      - $CM_BUILD_DIR/SUNAPSEZERO.ipa
